<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0E2A2C;
    --bg-panel: #123338;
    --teal: #2DD4BF;
    --teal-dim: #1B5E58;
    --amber: #F5A524;
    --danger: #E5484D;
    --cream: #F4F7F6;
    --ink: #0E2A2C;
    --muted: #7FA9A6;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal', sans-serif;
    background: radial-gradient(circle at 50% 0%, #163f42 0%, var(--bg-deep) 55%);
    color: var(--cream);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 28px 14px 60px;
  }
  .app{
    width:100%;
    max-width:480px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  .tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.3px;
    color: var(--teal);
    background: rgba(45,212,191,0.1);
    border:1px solid rgba(45,212,191,0.3);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .lang-btn{
    font-family:'Tajawal', sans-serif;
    font-size:12px;
    padding:5px 14px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.15);
    background:transparent;
    color: var(--muted);
    cursor:pointer;
  }
  .lang-btn.active{
    background: var(--teal);
    color:#0a2a26;
    border-color: var(--teal);
    font-weight:700;
  }
  h1{
    font-family:'Almarai', sans-serif;
    font-weight:800;
    font-size:22px;
    margin:0 0 6px;
    line-height:1.4;
  }
  .sub{
    color: var(--muted);
    font-size:14px;
    margin:0;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 20px 0 18px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--teal);
    border-radius:6px;
    transition: width 0.35s ease;
  }
  .progress-label{
    font-size:12px;
    color: var(--muted);
    white-space:nowrap;
  }
  .card{
    background: var(--bg-panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 22px 20px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
  }
  .q-title{
    font-family:'Almarai', sans-serif;
    font-weight:700;
    font-size:18px;
    line-height:1.6;
    margin: 0 0 18px;
  }
  .q-hint{
    font-size:13px;
    color: var(--muted);
    margin: -12px 0 16px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt-btn{
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--cream);
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    padding: 14px 16px;
    border-radius: 10px;
    text-align:start;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .opt-btn:hover{
    border-color: var(--teal);
    background: rgba(45,212,191,0.08);
  }
  .opt-btn:active{
    transform: scale(0.98);
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color: var(--muted);
    font-family:'Tajawal', sans-serif;
    font-size:13px;
    cursor:pointer;
    margin-bottom:14px;
    padding:0;
  }
  .back-btn:hover{ color: var(--teal); }

  /* Result screens */
  .result-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .badge-high{ background: rgba(45,212,191,0.15); color: var(--teal); border:1px solid rgba(45,212,191,0.4); }
  .badge-mid{ background: rgba(245,165,36,0.15); color: var(--amber); border:1px solid rgba(245,165,36,0.4); }
  .badge-danger{ background: rgba(229,72,77,0.18); color: #ff8a8d; border:1px solid rgba(229,72,77,0.5); }

  .result-title{
    font-family:'Almarai', sans-serif;
    font-weight:800;
    font-size:20px;
    margin: 0 0 10px;
    line-height:1.5;
  }
  .result-desc{
    font-size:14px;
    color: var(--muted);
    line-height:1.8;
    margin: 0 0 18px;
  }
  .part-box{
    background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(45,212,191,0.4);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .part-label{
    font-size:12px;
    color: var(--muted);
    margin:0 0 4px;
  }
  .part-name{
    font-family:'Almarai', sans-serif;
    font-weight:700;
    font-size:17px;
    color: var(--cream);
    margin:0;
  }
  .cta-btn{
    width:100%;
    background: var(--teal);
    color: var(--ink);
    font-family:'Almarai', sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    padding: 14px;
    border-radius: 10px;
    cursor:pointer;
    margin-bottom:10px;
  }
  .cta-btn.danger{
    background: var(--danger);
    color: white;
  }
  .cta-btn.ghost{
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--cream);
  }
  .feedback-row{
    display:flex;
    gap:10px;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .feedback-row p{
    font-size:13px;
    color: var(--muted);
    margin:0 0 10px;
    width:100%;
  }
  .fb-btn{
    flex:1;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.12);
    color: var(--cream);
    padding:10px;
    border-radius:8px;
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .fb-btn.selected-yes{ border-color: var(--teal); background: rgba(45,212,191,0.15); }
  .fb-btn.selected-no{ border-color: var(--danger); background: rgba(229,72,77,0.15); }
  .thanks{
    font-size:13px;
    color: var(--teal);
    margin-top:10px;
  }
  footer{
    text-align:center;
    margin-top:22px;
    font-size:11px;
    color: rgba(255,255,255,0.25);
  }
  .stats{
    display:flex;
    gap:10px;
    margin-top:14px;
    font-size:11px;
    color: var(--muted);
    justify-content:center;
  }
  .part-icon{
    width:56px;
    height:56px;
    margin:0 auto 10px;
    color: var(--teal);
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(45,212,191,0.08);
    border-radius:12px;
    padding:8px;
  }
  .part-icon svg{ width:100%; height:100%; }
</style>
</head>

// nt(): تختار حقل النص الصحيح من عقدة قادمة من الخادم (كل عقدة تحتوي النسختين معاً)
function nt(node, field){
  if(!node) return '';
  if(lang === "en" && node[field + '_en']) return node[field + '_en'];
  return node[field] || '';
}
function setLang(newLang){
  lang = newLang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  const tagEl = document.getElementById('headerTag');
  const titleEl = document.getElementById('headerTitle');
  const subEl = document.getElementById('headerSub');
  if(tagEl) tagEl.textContent = t('تجربة مجانية — فني');
  if(titleEl) titleEl.textContent = t('وش سبب عطل جهازك؟');
  if(subEl) subEl.textContent = t('أجب على بعض الأسئلة البسيطة لمعرفة السبب المحتمل والقطعة المطلوبة');
  const disclaimerEl = document.getElementById('footerDisclaimer');
  const copyrightEl = document.getElementById('footerCopyright');
  if(disclaimerEl) disclaimerEl.textContent = t('نموذج اختباري — النتائج تقديرية ولا تغني عن فحص فني عند الشك');
  if(copyrightEl) copyrightEl.textContent = t('© 2026 فني — جميع الحقوق محفوظة');
  const arBtn = document.getElementById('langArBtn');
  const enBtn = document.getElementById('langEnBtn');
  if(arBtn && enBtn){
    arBtn.classList.toggle('active', lang === 'ar');
    enBtn.classList.toggle('active', lang === 'en');
  }
  render();
}

async function apiCall(payload){
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify(payload)
    });
    return await res.json();
  } catch(e){
    console.error("API error:", e);
    return null;
  }
}
async function fetchNode(nodeId){
  if(nodeCache[nodeId]) return nodeCache[nodeId];
  const res = await apiCall({ action: "get_node", nodeId: nodeId });
  if(res && res.node){
    nodeCache[nodeId] = res.node;
    return res.node;
  }
  return null;
}
// تحميل صامت بالخلفية لكل الخيارات المحتملة القادمة، عشان يكون الجواب جاهز فور الضغط
function prefetchOptions(options){
  (options || []).forEach(opt => {
    if(opt.next && opt.next !== "ERROR_ROUTE" && !nodeCache[opt.next]){
      fetchNode(opt.next); // بدون await — تعمل بالخلفية بدون تعطيل الواجهة
    }
  });
}
async function refreshUsageStatus(){
  const res = await apiCall({ action: "get_status" });
  if(res && typeof res.used === "number"){
    usageStatus = res;
  }
  updateUsageBadge();
}
function updateUsageBadge(){
  const badge = document.getElementById('usageBadge');
  if(!badge) return;
  badge.textContent = usageStatus.remaining > 0
    ? `${t('متبقي لك')} ${usageStatus.remaining} ${t('من')} ${usageStatus.limit} ${t('تشخيصات مجانية')}`
    : t('انتهت تشخيصاتك المجانية لهذه الفترة');
}

function estimateDepth(){
  return Math.min(history.length, 5);
}

async function render(){
  const nodeId = history[history.length-1];

  if(nodeId === "LIMIT_REACHED"){
    progressFill.style.width = '100%';
    progressLabel.textContent = t('النتيجة');
    cardRoot.innerHTML = `
      <div class="result-title">${t('شكراً لكم لاستخدام الأداة 🙏')}</div>
      <div class="result-desc">
        ${t('الأداة حالياً تحت التجربة لغرض التطوير، وانتهت محاولاتك المجانية المتاحة بهذه المرحلة.')}
        ${t('تابعنا لمعرفة موعد الإطلاق الكامل قريباً.')}
      </div>
    `;
    return;
  }

  cardRoot.innerHTML = `<p style="text-align:center;color:var(--muted);padding:30px 0;">...</p>`;
  const node = await fetchNode(nodeId);
  if(!node){
    cardRoot.innerHTML = `<p style="text-align:center;color:var(--muted);padding:30px 0;">تعذّر تحميل السؤال، تحقق من الاتصال وأعد المحاولة.</p>
      <button class="cta-btn ghost" onclick="render()">إعادة المحاولة</button>`;
    return;
  }

  const depth = estimateDepth();
  progressFill.style.width = (node.result ? 100 : (depth/5)*90) + '%';
  progressLabel.textContent = node.result ? t('النتيجة') : `${t('الخطوة')} ${history.length}`;

  if(!node.result){
    let html = '';
    if(history.length > 1){
      html += `<button class="back-btn" onclick="goBack()">${t('‹ رجوع')}</button>`;
    }
    if(selectedBrand && nodeId !== 'brand_select' && nodeId !== 'fr_brand_select'){
      html += `<span class="tag" style="margin-bottom:12px;">${t('الجهاز')}: ${selectedBrand}</span>`;
    }
    html += `<div class="q-title">${nt(node,'q')}</div>`;
    if(node.hint){ html += `<div class="q-hint">${nt(node,'hint')}</div>`; }
    html += `<div class="options">`;
    (node.options || []).forEach((opt,i)=>{
      const brandAttr = opt.setBrand ? opt.setBrand : '';
      const applianceAttr = opt.setAppliance ? opt.setAppliance : '';
      const optLabel = (lang === "en" && opt.label_en) ? opt.label_en : opt.label;
      html += `<button class="opt-btn" onclick="choose('${opt.next}', '${brandAttr}', '${applianceAttr}')">${optLabel}</button>`;
    });
    html += `</div>`;
    cardRoot.innerHTML = html;
    prefetchOptions(node.options);
  } else {
    let badgeClass = 'badge-high';
    if(node.level === 'mid') badgeClass = 'badge-mid';
    if(node.level === 'danger') badgeClass = 'badge-danger';

    let html = `<button class="back-btn" onclick="goBack()">${t('‹ رجوع')}</button>`;
    if(node.categoryLabel){
      html += `<span class="result-badge badge-high" style="margin-left:8px;">${t('✓ مؤكد')}: ${nt(node,'categoryLabel')}</span>`;
    }
    html += `<span class="result-badge ${badgeClass}">${t('دقة السبب المحدد')}: ${node.confidence}</span>`;
    html += `<div class="result-title">${nt(node,'title')}</div>`;
    html += `<div class="result-desc">${nt(node,'desc')}</div>`;

    if(node.part){
      const brandLine = selectedBrand ? `<p class="part-label" style="margin-top:8px;">${t('متوافقة مع')}: ${selectedBrand}</p>` : '';
      const iconKey = node.partIcon && partIcons[node.partIcon] ? node.partIcon : 'generic';
      const iconHtml = `<div class="part-icon">${partIcons[iconKey]}</div><p style="font-size:11px;color:var(--muted);margin:-4px 0 12px;">${t('رسم توضيحي تخطيطي — ليس صورة للقطعة الفعلية')}</p>`;
      html += `<div class="part-box" style="text-align:center;">
        ${iconHtml}
        <p class="part-label">${t('القطعة المقترحة')}</p>
        <p class="part-name">${nt(node,'part')}</p>
        ${brandLine}
      </div>`;
    } else if(node.level === 'danger'){
      html += `<button class="cta-btn danger">${t('اتصل بفني معتمد الآن')}</button>`;
    } else {
      const label = node.actionLabel ? nt(node,'actionLabel') : t("هذه الحالة تحتاج فحص فني مباشر");
      html += `<button class="cta-btn ghost">${label}</button>`;
    }

    html += `<button class="cta-btn ghost" onclick="restart()" style="margin-top:0;">${t('ابدأ تشخيص جديد')}</button>`;

    html += `<div class="feedback-row" id="fbRow">

      <button class="fb-btn" onclick="giveFeedback(true)">${t('✅ نعم صحيح')}</button>
      <button class="fb-btn" onclick="giveFeedback(false)">${t('❌ غير دقيق')}</button>
    </div>`;

    cardRoot.innerHTML = html;
    window._lastNode = node; // للاستخدام بدالة logFeedback (اسم التشخيص)
  }
  renderStats();
}

async function choose(next, brand, appliance){
  if(brand){ selectedBrand = brand; }
  if(appliance){ currentAppliance = appliance; }
  if(next === "ERROR_ROUTE"){
    const res = await apiCall({ action: "resolve_error_route", appliance: currentAppliance, brand: selectedBrand });
    next = (res && res.nodeId) ? res.nodeId : "start";
  }
  // نتحقق مسبقاً هل العقدة التالية نتيجة تشخيص (result) قبل عرضها، عشان نطبّق حد الاستخدام
  const nextNode = await fetchNode(next);
  if(nextNode && nextNode.result){
    const res = await apiCall({ action: "check_and_use", appliance: currentAppliance, brand: selectedBrand });
    if(res && typeof res.used === "number"){
      usageStatus = { used: res.used, limit: res.limit, remaining: Math.max(0, res.limit - res.used) };
      updateUsageBadge();
    }
    // مهم: لو فشل الاتصال بالخادم لأي سبب (شبكة، سيرفر، إلخ)، نسمح بالاستمرار افتراضياً
    // بدل منع المستخدم ظلماً. المنع الفعلي يصير فقط إذا الخادم رد صراحة بأن الحد انتهى.
    if(res && res.allowed === false){
      history.push("LIMIT_REACHED");
      render();
      return;
    }
  }
  history.push(next);
  render();
}
function goBack(){
  if(history.length > 1){ history.pop(); render(); }
}
function restart(){
  selectedBrand = null;
  currentAppliance = null;
  history = ["appliance_select"];
  render();
}

  if(correct) stats.confirmed += 1;

  } else {
    row.innerHTML = `
      <p style="width:100%;font-size:13px;color:var(--muted);margin-bottom:8px;">${t('وش كانت المشكلة الفعلية؟ (اختياري، يساعدنا كثير نطوّر الدقة)')}</p>
      <textarea id="fbNote" rows="2" style="width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px;color:var(--cream);font-family:'Tajawal',sans-serif;font-size:13px;margin-bottom:8px;box-sizing:border-box;" placeholder="${t('مثال: طلع فعلياً موتور تالف مو كباستور')}"></textarea>
      <button class="cta-btn" style="margin-bottom:0;" onclick="submitFeedbackNote()">${t('إرسال')}</button>
    `;
  }
  renderStats();
}
function submitFeedbackNote(){
  const noteEl = document.getElementById('fbNote');
  const note = noteEl ? noteEl.value : '';
  logFeedback(false, note);
  document.getElementById('fbRow').innerHTML = `<p class="thanks">${t('شكراً على ملاحظتك التفصيلية — هذا يساعدنا كثير نطوّر الدقة.')}</p>`;
}
function logFeedback(correct, note){
  apiCall({
    action: "feedback",
    appliance: currentAppliance,
    brand: selectedBrand,
    diagnosisTitle: nt(window._lastNode, 'title') || '',
    correct: correct,
    note: note
  });
}
function renderStats(){
  if(stats.total === 0){ statsBar.innerHTML = ''; return; }
  const pct = Math.round((stats.confirmed/stats.total)*100);
  statsBar.innerHTML = `<span>${t('عدد التقييمات هذه الجلسة')}: ${stats.total}</span><span>·</span><span>${t('دقة مؤكدة')}: ${pct}%</span>`;
}

render();
</script>
</body>
</html>
