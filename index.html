<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0E2A2C;
    --bg-panel: #123338;
    --teal: #2DD4BF;
    --teal-dim: #1B5E58;
    --amber: #F5A524;
    --danger: #E5484D;
    --cream: #F4F7F6;
    --ink: #0E2A2C;
    --muted: #7FA9A6;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal', sans-serif;
    background: radial-gradient(circle at 50% 0%, #163f42 0%, var(--bg-deep) 55%);
    color: var(--cream);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 28px 14px 60px;
  }
  .app{
    width:100%;
    max-width:480px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  .tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.3px;
    color: var(--teal);
    background: rgba(45,212,191,0.1);
    border:1px solid rgba(45,212,191,0.3);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .lang-btn{
    font-family:'Tajawal', sans-serif;
    font-size:12px;
    padding:5px 14px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.15);
    background:transparent;
    color: var(--muted);
    cursor:pointer;
  }
  .lang-btn.active{
    background: var(--teal);
    color:#0a2a26;
    border-color: var(--teal);
    font-weight:700;
  }
  h1{
    font-family:'Almarai', sans-serif;
    font-weight:800;
    font-size:22px;
    margin:0 0 6px;
    line-height:1.4;
  }
  .sub{
    color: var(--muted);
    font-size:14px;
    margin:0;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 20px 0 18px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--teal);
    border-radius:6px;
    transition: width 0.35s ease;
  }
  .progress-label{
    font-size:12px;
    color: var(--muted);
    white-space:nowrap;
  }
  .card{
    background: var(--bg-panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 22px 20px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
  }
  .q-title{
    font-family:'Almarai', sans-serif;
    font-weight:700;
    font-size:18px;
    line-height:1.6;
    margin: 0 0 18px;
  }
  .q-hint{
    font-size:13px;
    color: var(--muted);
    margin: -12px 0 16px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt-btn{
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--cream);
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    padding: 14px 16px;
    border-radius: 10px;
    text-align:start;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .opt-btn:hover{
    border-color: var(--teal);
    background: rgba(45,212,191,0.08);
  }
  .opt-btn:active{
    transform: scale(0.98);
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color: var(--muted);
    font-family:'Tajawal', sans-serif;
    font-size:13px;
    cursor:pointer;
    margin-bottom:14px;
    padding:0;
  }
  .back-btn:hover{ color: var(--teal); }

  /* Result screens */
  .result-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .badge-high{ background: rgba(45,212,191,0.15); color: var(--teal); border:1px solid rgba(45,212,191,0.4); }
  .badge-mid{ background: rgba(245,165,36,0.15); color: var(--amber); border:1px solid rgba(245,165,36,0.4); }
  .badge-danger{ background: rgba(229,72,77,0.18); color: #ff8a8d; border:1px solid rgba(229,72,77,0.5); }

  .result-title{
    font-family:'Almarai', sans-serif;
    font-weight:800;
    font-size:20px;
    margin: 0 0 10px;
    line-height:1.5;
  }
  .result-desc{
    font-size:14px;
    color: var(--muted);
    line-height:1.8;
    margin: 0 0 18px;
  }
  .part-box{
    background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(45,212,191,0.4);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .part-label{
    font-size:12px;
    color: var(--muted);
    margin:0 0 4px;
  }
  .part-name{
    font-family:'Almarai', sans-serif;
    font-weight:700;
    font-size:17px;
    color: var(--cream);
    margin:0;
  }
  .cta-btn{
    width:100%;
    background: var(--teal);
    color: var(--ink);
    font-family:'Almarai', sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    padding: 14px;
    border-radius: 10px;
    cursor:pointer;
    margin-bottom:10px;
  }
  .cta-btn.danger{
    background: var(--danger);
    color: white;
  }
  .cta-btn.ghost{
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--cream);
  }
  .feedback-row{
    display:flex;
    gap:10px;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .feedback-row p{
    font-size:13px;
    color: var(--muted);
    margin:0 0 10px;
    width:100%;
  }
  .fb-btn{
    flex:1;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.12);
    color: var(--cream);
    padding:10px;
    border-radius:8px;
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .fb-btn.selected-yes{ border-color: var(--teal); background: rgba(45,212,191,0.15); }
  .fb-btn.selected-no{ border-color: var(--danger); background: rgba(229,72,77,0.15); }
  .thanks{
    font-size:13px;
    color: var(--teal);
    margin-top:10px;
  }
  footer{
    text-align:center;
    margin-top:22px;
    font-size:11px;
    color: rgba(255,255,255,0.25);
  }
  .stats{
    display:flex;
    gap:10px;
    margin-top:14px;
    font-size:11px;
    color: var(--muted);
    justify-content:center;
  }
  .part-icon{
    width:56px;
    height:56px;
    margin:0 auto 10px;
    color: var(--teal);
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(45,212,191,0.08);
    border-radius:12px;
    padding:8px;
  }
  .part-icon svg{ width:100%; height:100%; }
</style>
</head>

  "اذهب الآن بالقرب من الوحدة الخارجية واستمع جيداً: هل تسمع أي 'طنين' خفيف عند محاولة التشغيل، حتى لو لم تدُر؟": "Go near the outdoor unit now and listen closely: do you hear any faint 'hum' when it tries to start, even if it doesn't turn?",
  "اذهب الآن وانظر للوحدة الخارجية والفلتر مباشرة: هل تراهما متسخين بصرياً (طبقة غبار أو أوساخ واضحة)؟": "Go look at the outdoor unit and the filter directly now: do they look visibly dirty (a clear layer of dust or grime)?",
  "اذهب الآن وانظر لملف المكثف (خلف أو أسفل الثلاجة): هل متسخ بطبقة غبار واضحة؟": "Go look at the condenser coil now (behind or under the fridge): is it covered in a visible layer of dust?",
  "اذهب الآن وتحقق فعلياً: هل القابس متصل جيداً والقاطع الكهربائي مرفوع؟ وهل تقدر تشغّل جهازاً آخر بنفس المقبس؟": "Go check for real right now: is the plug properly connected and the breaker up? Can you run another appliance on the same outlet?",
  "اذهب الآن وتحقق فعلياً: هل القاطع الكهربائي (Breaker) الخاص بالمكيف بلوحة الكهرباء مرفوع (لم يفصل)؟ وهل تقدر تشغّل جهازاً كهربائياً آخر بنفس المصدر بنجاح؟": "Go check for real right now: is the AC's breaker in the panel up (not tripped)? Can you successfully run another electrical appliance on the same source?",
  "اذهب الآن وتحقق فعلياً: هل القاطع الكهربائي مرفوع (لم يفصل)؟ وهل تقدر تشغّل جهازاً كهربائياً آخر بنفس المقبس بنجاح؟": "Go check for real right now: is the breaker up (not tripped)? Can you successfully run another electrical appliance on the same outlet?",
  "اذهب للوحدة الخارجية الآن: استمع هل يوجد صوت 'فحيح' مستمر، وانظر للأنابيب النحاسية هل عليها تجمد ثلج؟": "Go to the outdoor unit now: listen for a continuous 'hissing' sound, and look at the copper pipes for ice buildup",
  "ازدحام المحتوى أو إعداد حرارة غير مناسب": "Overcrowded contents or wrong temperature setting",
  "استمع الآن بعناية: من أين يصدر الصوت الغريب بالضبط؟": "Listen carefully now: exactly where is the strange noise coming from?",
  "استمع الآن بعناية: من أين يصدر الصوت الغريب؟": "Listen carefully now: where is the strange noise coming from?",
  "استمع الآن جيداً للجهاز: هل تسمع أي صوت تشغيل (مروحة أو كمبروسر)؟": "Listen closely to the unit now: do you hear any running sound (fan or compressor)?",
  "استمع الآن جيداً: هل تسمع صوت طنين من الموتور بدون أي حركة فعلية للحوض؟": "Listen closely now: do you hear a humming sound from the motor with no actual tub movement?",
  "استمع الآن جيداً: هل يوجد صوت 'فحيح' مستمر من داخل الجهاز، أو تلاحظ تجمد ثلج على الملف الداخلي المكشوف؟": "Listen closely now: is there a continuous 'hissing' sound from inside the unit, or do you notice ice forming on the exposed indoor coil?",
  "استمع الآن قرب الجزء الخلفي السفلي للثلاجة: هل تسمع نمط 'نقرة - طنين - نقرة' متكرر كل بضع دقائق؟": "Listen near the lower back of the fridge now: do you hear a repeating 'click - hum - click' pattern every few minutes?",
  "اشتعال غير منتظم مع صوت 'بوووف' خفيف": "Irregular ignition with a faint 'whoosh' sound",
  "افتح الغطاء الآن وانظر: هل الحمولة موزعة بشكل متساوٍ بالحوض، أم متكتلة بجهة واحدة؟": "Open the lid now and look: is the load evenly distributed in the tub, or bunched to one side?",
  "افتح الفريزر الآن وانظر خلف اللوحة الداخلية: هل ملف الإيفابريتر مغطى بطبقة ثلج سميكة تسد كل شيء؟": "Open the freezer now and look behind the inner panel: is the evaporator coil covered by a thick layer of ice blocking everything?",
  "افتح الفريزر والثلاجة الآن وتحقق من كل قسم بيدك، وراقب الإضاءة الداخلية:": "Open the freezer and fridge now and check each compartment by hand, and watch the interior light:",
  "افتح باب الفرن الآن وانظر لعنصر التسخين السفلي (الحلزوني بقاع الفرن): هل يتوهج بلون أحمر-برتقالي عند التشغيل؟": "Open the oven door now and look at the bottom (coiled) heating element: does it glow red-orange when running?",
  "افتح باب الفريزر الآن واستمع: هل تسمع صوت مروحة تدور بالداخل؟": "Open the freezer door now and listen: do you hear a fan spinning inside?",
  "افتح غطاء الفلتر الآن وانظر إليه مباشرة: هل يبدو متسخاً (طبقة غبار كثيفة على الشبك)؟": "Open the filter cover now and look at it directly: does it look dirty (a thick layer of dust on the mesh)?",
  "افتح غطاء الفلتر الآن وانظر إليه مباشرة: هل يبدو متسخاً (طبقة غبار كثيفة)؟": "Open the filter cover now and look at it directly: does it look dirty (a thick layer of dust)?",
  "افتح غطاء الوحدة الداخلية الآن وانظر مباشرة لملف الألمنيوم الداخلي (الملف المموج): هل تراه مغطى بطبقة ثلج أو صقيع أبيض؟": "Open the indoor unit's cover now and look directly at the aluminum coil (the ridged coil): do you see it covered in ice or white frost?",
  "افحص الباب الآن: هل يُغلق تماماً بإحكام، أم يوجد قطعة قماش أو جزء من الملابس عالق يمنع الإغلاق الكامل؟": "Check the door now: does it close completely and securely, or is there a piece of fabric or clothing stuck preventing full closure?",
  "افصل الغسالة عن الكهرباء أولاً قبل فتح أي غطاء بالأسفل": "Unplug the washer from electricity first before opening any cover at the bottom",
  "افصل الغسالة عن الكهرباء فوراً وأغلق صنبور تغذية الماء بالكامل. هذا إنذار أمان حساس مصمم لمنع أضرار مائية كبيرة، ويحتاج فحصاً فنياً مباشراً قبل أي استخدام آخر.": "Unplug the washer from electricity immediately and fully close the water supply tap. This is a sensitive safety alarm designed to prevent major water damage, and needs a direct technician's check before any further use.",
  "افصل الكهرباء عن الجهاز بالكامل أولاً، ثم انظر الآن لجسم الكباستور (عادة قطعة أسطوانية واحدة تشغّل المروحة والكمبروسر معاً بمكيفات الشباك): هل شكله منتفخ من أعلى بدل مسطح، أو به تسريب سائل؟": "First disconnect all electricity from the unit, then look now at the capacitor body (usually one cylindrical part running both the fan and compressor in window units): does its top look bulged instead of flat, or is there liquid leaking from it?",
  "افصل الكهرباء عن الجهاز بالكامل أولاً، ثم انظر الآن لجسم الكباستور (قطعة أسطوانية صغيرة داخل صندوق الكهرباء): هل شكله منتفخ من أعلى بدل مسطح، أو به تسريب سائل؟": "First disconnect all electricity from the unit, then look now at the capacitor body (a small cylindrical part inside the electrical box): does its top look bulged instead of flat, or is there liquid leaking from it?",
  "افصل الكهرباء، أعد توصيل وصلة الأسلاك أعلى الباب بإحكام، ثم أعد التشغيل": "Disconnect the power, firmly reconnect the wire harness above the door, then power back on",
  "الأغلب تسريب فريون أو ضعف كفاءة الكمبروسر داخلياً": "Most likely a refrigerant leak or internally weak compressor efficiency",
  "الأغلب مشكلة حقيقية بدائرة الفريون أو كفاءة ضغط الكمبروسر": "Most likely a real issue with the refrigerant circuit or compressor compression efficiency",
  "الأكواد تختلف حسب الماركة والموديل، وما عندنا قائمة مؤكدة لماركتك بعد.": "Codes vary by brand and model, and we don't have a confirmed list for your brand yet.",
  "الأكواد تختلف كلياً حسب الماركة والموديل، وما عندنا قائمة مؤكدة لماركتك بعد.": "Codes vary completely by brand and model, and we don't have a confirmed list for your brand yet.",
  "الأكواد تختلف كلياً حسب الماركة والموديل، وما عندنا قائمة مؤكدة لماركتك بعد. أفضل خطوة الآن:": "Codes vary completely by brand and model, and we don't have a confirmed list for your brand yet. The best step now:",
  "الإضاءة الداخلية لا تعمل، لا صوت أي تشغيل": "Interior light doesn't work, no running sound at all",
  "الإضاءة/الشاشة تعمل، لكن الجهاز لا يستجيب للتشغيل الفعلي (وقد يومض ضوء أو رمز)": "Display/light works, but the unit doesn't actually respond when started (a light or code may blink)",
  "الاشتعال ثم الانطفاء السريع بالأفران القديمة ذات مقبض الإشعال اليدوي توقيع كلاسيكي لثرموكابل تالف لا يُبقي صمام الغاز مفتوحاً بعد تحرير المقبض.": "Ignition followed by quick shutoff in older ovens with a manual ignition knob is a classic sign of a failed thermocouple that doesn't keep the gas valve open after releasing the knob.",
  "الاشتعال غير المنتظم مع صوت انفجار خفيف غالباً بسبب بقايا طعام أو أوساخ تسد بعض فتحات الحارق. نظّفها بفرشاة ناعمة قبل افتراض أي عطل بالقطع.": "Irregular ignition with a faint popping sound is often caused by food residue or dirt clogging some of the burner ports. Clean them with a soft brush before assuming any part is faulty.",
  "الانتفاخ أو التسريب من جسم الكباستور دليل شبه مؤكد على تلفه فعلياً — هذا أعلى مستوى ثقة يمكن الوصول له بدون أجهزة قياس متخصصة.": "Bulging or leaking from the capacitor body is near-certain proof it has actually failed — this is the highest confidence level achievable without specialized measuring equipment.",
  "الباب لا يقفل، أو يظهر خطأ متعلق بالباب": "Door doesn't lock, or a door-related error shows",
  "التبريد يعمل لكن ضعيف نوعاً ما": "Cooling works but is somewhat weak",
  "التوهج الخافت يعني أن الشمعة لا تسحب تياراً كافياً لفتح صمام الغاز رغم أنها لا تزال تعمل جزئياً. هذا نمط شائع جداً وموثق لشمعة إشعال متدهورة تحتاج استبدالاً.": "A weak glow means the igniter isn't drawing enough current to open the gas valve even though it's still partially working. This is a very common, well-documented sign of a degraded igniter that needs replacing.",
  "الثلاجات الحديثة تستخدم غاز تبريد (R600a) قابل للاشتعال. رائحة كبريت أو ثوم قوية قرب الثلاجة (وليست من الطعام) مؤشر خطر حقيقي. افصل الثلاجة من القابس مباشرة فقط، لا تلمس أي مفتاح كهربائي قريب، هوّي المكان جيداً، واتصل بفني فوراً.": "Modern fridges use flammable refrigerant gas (R600a). A strong sulfur or garlic smell near the fridge (not from food) is a real danger sign. Only unplug the fridge from the socket directly, don't touch any nearby electrical switch, ventilate the area well, and call a technician immediately.",
  "الرموز تختلف كلياً حسب الماركة، لذا اخترنا ماركتك أولاً": "Codes vary completely by brand, so we picked your brand first",
  "الرموز تختلف كلياً حسب الماركة، لذا اخترنا ماركتك أولاً لعرض الأكواد الصحيحة": "Codes vary completely by brand, so we picked your brand first to show the correct codes",
  "الريموت لا يستجيب": "The remote isn't responding",
  "الشاشة تعمل لكن لا يسخن إطلاقاً": "Display works but it doesn't heat at all",
  "الشمعة تعمل، لكن الغاز لا يصل أو لا يشتعل — 85%": "Igniter works, but gas isn't reaching or igniting — 85%",
  "الصوت الغريب المستمر من الوحدة الداخلية غالباً سببه بيرنق أو موتور المروحة الداخلية.": "A continuous strange noise from the indoor unit is often caused by a bearing or the indoor fan motor.",
  "الصوت موجود بكل المراحل بنفس المستوى تقريباً": "The noise is present at roughly the same level in every stage",
  "الغسالة العادية وحدتان منفصلتان تماماً (غسيل وتنشيف)، فلكل منهما تشخيص خاص بها": "A twin-tub washer has two completely separate units (wash and spin), each with its own diagnosis",
  "الفرق بسيط جداً، تقريباً نفس حرارة الغرفة": "The difference is very slight, almost the same as room temperature",
  "الفريزر بارد جداً، لكن الثلاجة دافئة أو غير باردة كفاية": "Freezer is very cold, but the fridge is warm or not cold enough",
  "الفريزر بارد لكن لا ثلج ينتج، وماء الباب يعمل طبيعي": "Freezer is cold but no ice is produced, and the door's water dispenser works normally",
  "الفريزر بارد والمروحة تدور بشكل طبيعي، لكن الثلاجة لا تستقبل هواءً بارداً كافياً. السبب الأرجح فتحة تحويل الهواء (Damper) عالقة، أو حساس حراري لا يقرأ بدقة فيمنع فتح الدفروست بالوقت الصحيح.": "The freezer is cold and the fan spins normally, but the fridge isn't getting enough cold air. The most likely cause is a stuck air damper, or a temperature sensor reading inaccurately and preventing the damper from opening at the right time.",
  "الفريزر بارد وماء الباب يعمل، لكن صانعة الثلج لا تستقبل ماء — الاحتمال الأرجح صمام المياه الخاص بصانعة الثلج لا يفتح بشكل صحيح.": "The freezer is cold and the door dispenser works, but the ice maker isn't receiving water — the most likely cause is the ice maker's water valve not opening properly.",
  "الفلتر المتسخ يقيّد تدفق الهواء ويُسبب تبريد متقطع وتوقف متكرر. نظّف أو استبدل الفلتر أولاً قبل أي تشخيص إضافي.": "A dirty filter restricts airflow and causes intermittent cooling and repeated shutdowns. Clean or replace the filter first before any further diagnosis.",
  "الفلتر نظيف، أو غير متوفر بهذا الموديل": "The filter is clean, or not available on this model",
  "القاطع الرئيسي فصل بالكامل وبسرعة": "The main breaker tripped fully and quickly",
  "القاطع الكهربائي يفصل فور التشغيل": "The breaker trips as soon as it's started",
  "القاطع فصل بالكامل وبسرعة": "The breaker tripped fully and quickly",
  "الكهرباء لا تصل للوحدة الخارجية إطلاقاً — 90%": "Power isn't reaching the outdoor unit at all — 90%",
  "المروحة الداخلية تعمل بشكل طبيعي، لكن عدم وصول أي إشارة أو طنين للوحدة الخارجية يشير غالباً لقاطع تلامس تالف لا يمرر الكهرباء للوحدة الخارجية أصلاً، أو مشكلة بالأسلاك بين الوحدتين. هذه أرخص بكثير من البطاقة الإلكترونية، لذا يُنصح بفحصها أولاً.": "The indoor fan runs normally, but no signal or hum reaching the outdoor unit usually points to a failed contactor that isn't passing power to the outdoor unit at all, or a wiring issue between the units. This is much cheaper than the control board, so it's advisable to check it first.",
  "المشكلة بمكونات تشغيل الكمبروسر الكهربائية — 95%": "The problem is with the compressor's electrical start components — 95%",
  "الملف نظيف نسبياً لكن المروحة لا تدور أو تصدر صوت احتكاك — هذا يشير مباشرة لعطل بموتور مروحة الإيفابريتر نفسه.": "The coil is relatively clean but the fan doesn't spin or makes a grinding noise — this points directly to a fault in the evaporator fan motor itself.",
  "امتلاء زائد بالماء": "Overfilling with water",
  "امسح لوحة التحكم أولاً وأعد المحاولة": "Wipe the control panel first and try again",
  "انسداد الصرف وتفعيل مفتاح أمان مستوى المياه": "Drain blockage triggering the water level safety switch",
  "انسداد فلتر الماء": "Clogged water filter",
  "انسداد فلتر الهواء": "Clogged air filter",
  "انسداد فلتر مضخة التصريف": "Clogged drain pump filter",
  "انسداد فوهة الحارق بالأوساخ": "Burner port clogged with debris",
  "انسداد قناة التصريف الخارجية": "Blocked outdoor drain channel",
  "انسداد مواسير الصرف": "Blocked drain pipes",
  "انظر الآن بدقة: من أين يتسرب الماء بالضبط؟": "Look closely now: exactly where is the water leaking from?",
  "انظر الآن خلف اللوحة الداخلية بالفريزر (إن أمكن الوصول): هل ملف الإيفابريتر مغطى بطبقة ثلج كثيفة تسد المروحة؟": "Look behind the freezer's inner panel now (if accessible): is the evaporator coil covered in a thick layer of ice blocking the fan?",
  "انظر الآن لشاشة الثلاجة: هل يظهر أي رمز خطأ (حروف وأرقام)؟": "Look at the fridge display now: does any error code (letters and numbers) appear?",
  "انظر الآن لشاشة الغسالة: هل يظهر أي رمز خطأ (حروف وأرقام)؟": "Look at the washer's display now: does any error code (letters and numbers) appear?",
  "انظر الآن لشاشة الفرن: هل يظهر أي رمز خطأ (حروف وأرقام)؟": "Look at the oven's display now: does any error code (letters and numbers) appear?",
  "انظر الآن لشاشة الوحدة الداخلية أو الريموت: هل يظهر أي رمز خطأ (حروف وأرقام تومض)؟": "Look at the indoor unit's display or remote now: does any error code (blinking letters and numbers) appear?",
  "انظر الآن لشاشة الوحدة الداخلية مباشرة: هل يوجد ضوء يومض أو رمز خطأ؟ وهل لاحظت مؤخراً تسريب ماء أو بطء بمواسير الصرف؟": "Look directly at the indoor unit's display now: is there a blinking light or error code? Have you recently noticed a water leak or slow drainage?",
  "انظر الآن لمروحة المكثف الخلفية (إن أمكن الوصول): هل تدور بشكل طبيعي؟": "Look at the rear condenser fan now (if accessible): does it spin normally?",
  "انظر الآن لمروحة الوحدة الخارجية مباشرة: هل تدور بشكل طبيعي؟": "Look directly at the outdoor unit's fan now: does it spin normally?",
  "انظر الآن مباشرة: أين موقع تسرب الماء بالضبط؟": "Look directly now: exactly where is the water leak located?",
  "انظر الآن مباشرة: هل الماء يتساقط للخارج من تحت الجهاز خارج النافذة، أم يتسرب لداخل الغرفة؟": "Look directly now: is water dripping outward from under the unit outside the window, or leaking into the room?",
  "انظر واستمع الآن لفتحة الوحدة الداخلية بالغرفة: هل ترى/تسمع المروحة تدور عند التشغيل؟": "Look and listen at the indoor unit's vent in the room now: can you see/hear the fan spinning when it's on?",
  "اهتزاز أو صوت قوي بحوض التنشيف تحديداً أثناء الدوران السريع يشير لتآكل بالبلي الداعم للحوض الداخلي.": "Vibration or a loud noise specifically in the spin tub during fast spinning points to worn bearings supporting the inner tub.",
  "اهتزاز شديد تحديداً أثناء التنشيف السريع يشير لتآكل بلي الحوض أو ضعف بمساعدات التعليق (Shock Absorbers) بالغسالات الأمامية التحميل. هذا يحتاج فحصاً فنياً لتحديد أيهما بالضبط، لأن كليهما يتطلب فك الغسالة جزئياً للتأكيد.": "Severe vibration specifically during high-speed spin points to worn tub bearings or weakened shock absorbers in front-load washers. This needs a technician's check to pinpoint which one exactly, since both require partially disassembling the washer to confirm.",

  "بعد التأكد، أعد التشخيص من جديد": "After confirming, restart the diagnosis",
  "بعض القطع (خصوصاً الكباستور المزدوج) تختلف مواصفاتها حسب الماركة والسعة": "Some parts (especially dual capacitors) have specifications that vary by brand and capacity",
  "بلي (Bearing) الحوض أو نظام التعليق (Suspension)": "Tub bearing or suspension system",
  "بلي (Bearing) حوض التنشيف متآكل": "Spin tub bearing worn out",
  "بلي حوض التنشيف": "Spin tub bearing",
  "تأكد من ميلان الجهاز للخلف قليلاً، ونظّف قناة التصريف الداخلية": "Make sure the unit tilts slightly backward, and clean the internal drain channel",
  "تابع التشخيص بالأعراض بدل الكود": "Continue diagnosis by symptoms instead of the code",
  "تجمد الملف الداخلي بكثافة يمنع تدفق الهواء البارد بالكامل. السبب الأرجح عنصر تسخين الديفروست لا يعمل، أو حساس/تايمر الديفروست تالف، فلا يذوب الثلج المتراكم دورياً كما يجب.": "Heavy frost on the indoor coil completely blocks cold air flow. The most likely cause is a non-working defrost heater, or a faulty defrost sensor/timer, so accumulated ice doesn't melt periodically as it should.",
  "تجمد الملف الداخلي مع سلامة الفلتر والمكثف الخارجي (تم استبعادهما) يشير غالباً لنقص طفيف بشحنة الفريون لم يصل بعد لدرجة إحداث صوت فحيح واضح، أو انسداد جزئي بتدفق الهواء الداخلي. كلا الاحتمالين يحتاج فحص فني بمعدات ضغط لتأكيد السبب الدقيق، ولا يمكن اقتراح قطعة بثقة قبل هذا الفحص.": "Indoor coil frosting with a clean filter and outdoor condenser (both ruled out) usually points to a slight refrigerant shortage not yet severe enough to cause an audible hiss, or a partial blockage in indoor airflow. Both possibilities need a technician's pressure gauge check to confirm the exact cause, and no part can be confidently suggested before that check.",
  "تجمد الملف الداخلي — غالباً نقص طفيف بالفريون": "Indoor coil frosting — likely a slight refrigerant shortage",
  "تحقق الآن من خرطوم التصريف الخلفي: هل هو ملتوٍ، أو مدخل بعمق أكثر من 15 سم داخل أنبوب الصرف بالحائط؟": "Check the rear drain hose now: is it kinked, or inserted more than 15 cm into the wall drain pipe?",
  "تحقق من القابس والقاطع الكهربائي أولاً": "Check the plug and breaker first",
  "تحقق من القاطع الكهربائي والمصدر أولاً": "Check the breaker and power source first",
  "تحققت الآن، والكهرباء سليمة تماماً": "I've checked now, and the power is completely fine",
  "تدور بشكل طبيعي": "Spins normally",
  "تدور بشكل طبيعي، لكن لا صوت إطلاقاً من الوحدة الخارجية": "Spins normally, but there's no sound at all from the outdoor unit",
  "تسريب الماء من أسفل الثلاجة من الخلف شبه دائماً بسبب انسداد قناة أو صمام التصريف الخارجي.": "Water leaking from under the back of the fridge is almost always caused by a blocked drain channel or the outdoor drain valve.",
  "تسريب الماء من الوحدة الداخلية شبه دائماً بسبب انسداد قناة تصريف المياه المتكاثفة.": "Water leaking from the indoor unit is almost always caused by a blocked condensate drain channel.",
  "تسريب حول الباب أثناء الغسيل تحديداً (بالغسالات الأمامية التحميل) يشير مباشرة لحلقة إحكام الباب المطاطية التالفة أو المتسخة بجسم غريب يمنع الإغلاق الكامل.": "Leaking around the door specifically during washing (front-load washers) points directly to a damaged rubber door seal, or one dirtied by a foreign object preventing a full seal.",
  "تسريب فريون أو انسداد بصمام التمدد": "Refrigerant leak or blocked expansion valve",
  "تسريب ماء": "Water leak",
  "تسريب ماء من الغسالة": "Water leaking from the washer",
  "تسريب ماء من الوحدة الداخلية": "Water leaking from the indoor unit",
  "تسريب مستمر من الأسفل طوال الدورة": "Continuous leak from the bottom throughout the cycle",
  "تسريب مستمر من الأسفل طوال الدورة (مو فقط أثناء التصريف) يشير لحلقة إحكام أو وصلة بمضخة التصريف تسرّب باستمرار.": "A continuous leak from the bottom throughout the cycle (not just during draining) points to a drain pump seal or connection leaking constantly.",
  "تسريب من حوض التنشيف تحديداً يشير لحلقة إحكام تالفة حول محور دوران السلة الداخلية.": "A leak specifically from the spin tub points to a damaged seal around the inner basket's rotating shaft.",
  "تسريب من حوض الغسيل تحديداً يشير لحلقة إحكام تالفة حول محور دوران العصا الدوارة (Pulsator) بقاع الحوض.": "A leak specifically from the wash tub points to a damaged seal around the pulsator's rotating shaft at the bottom of the tub.",
  "تسريب من حول الباب أثناء الغسيل فقط": "Leaking around the door only during washing",
  "تسريب من نقطة التصريف المشتركة بين الحوضين يشير مباشرة لصمام التصريف نفسه أو تلف بالخرطوم عند نقطة الاتصال.": "A leak from the shared drain point between the two tubs points directly to the drain valve itself or hose damage at the connection point.",
  "تصرف الماء بشكل طبيعي لكن لا تنشف (Spin)": "Drains normally but doesn't spin",
  "تفعّل واقي الحمل الحراري للكمبروسر دفاعياً — 90%": "The compressor's thermal overload protector engaging defensively — 90%",
  "تقطير الماء للخارج تصميم طبيعي بمكيفات الشباك وليس عطلاً — العطل الحقيقي فقط عند تسرب الماء لداخل الغرفة": "Water dripping outward is a normal design feature of window units, not a fault — the real fault is only when water leaks into the room",
  "تماس كهربائي محتمل — يحتاج فني فوراً": "Possible electrical short — needs a technician immediately",
  "تمتلئ بالماء لكن لا تغسل (لا دوران للحوض)": "Fills with water but doesn't wash (tub doesn't turn)",
  "تنظيف مواسير الصرف (أولاً) — أو مفتاح مستوى المياه (Float Switch) إذا استمرت المشكلة بعد التنظيف": "Clean the drain pipes (first) — or the float switch if the problem persists after cleaning",
  "توقف الطنين من تلقاء نفسه دون فصل القاطع الرئيسي يشير لتيار مسحوب أقل، وهذا يتوافق مع كباستور ضعيف أكثر من كمبروسر مقفول (الذي يسحب تياراً أعلى بكثير). هذه قطعة رخيصة نسبياً ويُنصح بتجربتها أولاً. ملاحظة أمان: لا تكرر محاولة التشغيل بشكل متتالي — كل محاولة فاشلة تُجهد ملفات الكمبروسر وقد تحوّل عطلاً بسيطاً لعطل مكلف.": "The hum stopping on its own without tripping the main breaker points to lower current draw, which fits a weak capacitor more than a locked compressor (which draws much higher current). This is a relatively cheap part and worth trying first. Safety note: don't repeatedly retry starting it — every failed attempt stresses the compressor windings and can turn a minor fault into a costly one.",
  "توقف الطنين من تلقاء نفسه، القاطع الرئيسي لم يفصل": "The hum stopped on its own, the main breaker didn't trip",
  "توقف الطنين من تلقاء نفسه، القاطع لم يفصل": "The hum stopped on its own, the breaker didn't trip",
  "توهج الشمعة بقوة يعني أنها تسحب تياراً كافياً، لكن عدم اشتعال الغاز رغم ذلك يشير لعطل بصمام الأمان نفسه أو انسداد بفوهة الحارق. هذا يتعامل مع خط غاز مباشر، يُفضّل فني للفحص والاستبدال.": "The igniter glowing strongly means it's drawing enough current, but the gas still not igniting points to a fault in the safety valve itself or a clogged burner port. Since this deals with a direct gas line, a technician is preferred for inspection and replacement.",
  "توهج قوي وواضح، لكن الغاز لا يشتعل": "Strong, clear glow, but the gas doesn't ignite",

  "جرّب الآن بطارية جديدة بالريموت — هل تغيّر شيء بعد التجربة؟": "Try a fresh battery in the remote now — did anything change after that?",
  "جرّب بطارية جديدة أولاً": "Try a fresh battery first",
  "جرّب تعديل الإعداد وتقليل الازدحام — إذا استمرت المشكلة راجع فني": "Try adjusting the setting and reducing overcrowding — if it persists, see a technician",
  "جرّب كباستور جديد أولاً (رخيص ويستبعد الاحتمال الأرخص) — إذا استمر العطل بعده، الاحتمال الأقوى كمبروسر ويحتاج فني فوراً": "Try a new capacitor first (cheap, and rules out the cheaper possibility) — if the fault persists after that, the stronger likelihood is the compressor, which needs a technician right away",
  "جرّبت الآن وما زال لا يستجيب": "I tried it now and it still isn't responding",
  "حساس حرارة الفرن (Oven Temperature Sensor)": "Oven temperature sensor",
  "حساس حرارة الفرن السليم يجب أن يقرأ تقريباً 1080 أوم بحرارة الغرفة. القراءة خارج هذا النطاق أو تذبذب القراءة يعني حساساً تالفاً يرسل بيانات خاطئة للوحة التحكم.": "A healthy oven temperature sensor should read about 1080 ohms at room temperature. A reading outside this range, or a fluctuating reading, means a faulty sensor sending wrong data to the control board.",

  "حساس ضغط/مستوى الماء (Pressure Sensor)": "Pressure/water level sensor",
  "حسب كود الجهاز، الحساس الحراري لا يقرأ الحرارة بدقة أو به قصر/انقطاع كهربائي.": "Based on the unit's code, the temperature sensor isn't reading accurately or has an electrical short/open circuit.",
  "حلقة إحكام الباب (Door Boot Seal)": "Door boot seal",
  "حلقة إحكام الباب (Door Boot Seal) تالفة": "Faulty door boot seal",
  "حلقة إحكام حوض التنشيف": "Spin tub seal",

  "حلقة الباب المطاطية تالفة أو لا تُحكم الإغلاق": "Rubber door gasket is damaged or not sealing properly",
  "حلقة باب (Door Gasket) — جرّب التنظيف أولاً": "Door gasket — try cleaning it first",
  "حماية من حمل زائد أو عطل حقيقي بالموتور — 80%": "Overload protection or a real motor fault — 80%",
  "حمولة غير متوازنة — ليس عطلاً بقطعة": "Unbalanced load — not a part fault",
  "حوض الغسيل يعمل بشكل طبيعي، لكن حوض التنشيف لا يعمل": "The wash tub works normally, but the spin tub doesn't work",
  "خرطوم ملتوٍ أو مدخل بعمق زائد داخل أنبوب الصرف يخلق تأثير سحب عكسي (Siphoning) يمنع التصريف الطبيعي حتى مع سلامة المضخة تماماً.": "A kinked hose, or one inserted too deep into the drain pipe, creates a reverse siphoning effect that prevents normal draining even if the pump is completely fine.",
  "خروج الورقة بسهولة من نقطة بمحيط الباب يعني تسرب هواء بارد مستمر لتلك النقطة، ما يجهد الكمبروسر ويقلل كفاءة التبريد. غالباً الحل تنظيف الحلقة أولاً (قد يكون السبب أوساخ تمنع الإحكام)، وإذا استمر فاستبدالها.": "The note sliding out easily at a point around the door means cold air is continuously leaking there, which stresses the compressor and reduces cooling efficiency. The fix is often cleaning the gasket first (dirt may be preventing a tight seal), and replacing it if that doesn't help.",
  "خطأ اتصال بعد فتح الباب": "Communication error after opening the door",
  "خطأ الاتصال بعد فتح الباب غالباً سببه وصلة الأسلاك المارة أعلى الباب (بين جسم الثلاجة والباب) غير متصلة بإحكام.": "A communication error after opening the door is usually caused by the wire harness running above the door (between the fridge body and the door) not being securely connected.",
  "خطر ارتفاع حرارة — أوقف الاستخدام فوراً": "Overheat hazard — stop use immediately",
  "رائحة احتراق قوية أو شرارة أو دخان مؤشر خطر تماس كهربائي حقيقي. افصل القاطع الكهربائي فوراً ولا تحاول التشغيل مرة أخرى. هذه الحالة تحتاج فني معتمد فقط.": "A strong burning smell, sparks, or smoke is a sign of a real electrical short. Turn off the breaker immediately and don't try to run it again. This case needs a certified technician only.",
  "رائحة احتراق قوية، شرارة، أو دخان": "Strong burning smell, sparks, or smoke",
  "رائحة الاحتراق أو الدخان مؤشر خطر كهربائي حقيقي. افصل الكهرباء عن الجهاز فوراً ولا تحاول إعادة تشغيله. هذه الحالة تحتاج فني معتمد مباشرة، ولا يمكن تحديد قطعة بأمان دون فحص مباشر.": "A burning or smoke smell is a sign of a real electrical hazard. Disconnect power from the unit immediately and don't try to restart it. This case needs a certified technician right away, and no part can be safely identified without a direct inspection.",
  "رائحة كبريت أو ثوم قوية بالقرب من الثلاجة": "Strong sulfur or garlic smell near the fridge",
  "رائحة كهرباء محروقة أو دخان": "Smell of burnt electronics or smoke",
  "راقب الثلاجة الآن واختر الوصف الأقرب لما يحدث فعلاً:": "Watch the fridge now and pick the description closest to what's actually happening:",
  "راقب الجهاز الآن واختر الوصف الأقرب لما يحدث فعلاً:": "Watch the unit now and pick the description closest to what's actually happening:",
  "راقب صانعة الثلج الآن واختر الأقرب:": "Watch the ice maker now and pick the closest match:",
  "رطوبة أو بخار على لوحة اللمس": "Moisture or steam on the touch panel",
  "رمز آخر غير موجود بالقائمة": "A different code not on this list",
  "رمز يشير لقفل الكمبروسر": "Code indicating a locked compressor",
  "ريلاي التشغيل (Start Relay) تالف": "Faulty start relay",
  "ريلاي تشغيل (Start Relay)": "Start relay",
  "زر لوحة تحكم عالق أو حساس حرارة (حسب الموديل)": "Stuck control panel button or temperature sensor (model-dependent)",
  "سبليت (وحدة داخلية ووحدة خارجية منفصلتين)": "Split (separate indoor and outdoor units)",
  "سكون المروحة الداخلية تماماً رغم إضاءة المؤشرات يشير غالباً لعطل بالبطاقة الإلكترونية الداخلية أو موتور المروحة نفسه. ننصح بفحص موتور المروحة أولاً (أرخص) قبل التفكير بالبطاقة الإلكترونية.": "The indoor fan being completely still despite the indicator lights being on usually points to a fault in the indoor control board or the fan motor itself. We recommend checking the fan motor first (cheaper) before considering the control board.",
  "شباك (وحدة واحدة مدمجة بالنافذة)": "Window (single unit built into the window)",
  "شغّل الغسالة الآن على دورة عادية، وراقب ماذا يحدث بالضبط:": "Start the washer now on a normal cycle, and watch exactly what happens:",
  "شغّل الفرن الآن على وضع الخبز بحرارة 180 درجة، وراقب بعد بضع دقائق:": "Start the oven now on bake mode at 180 degrees, and watch after a few minutes:",
  "شغّل الفرن الآن وراقب فوهة الحارق مباشرة:": "Start the oven now and watch the burner port directly:",
  "شغّل المكيف الآن بالريموت أو الزر، وراقب ماذا يحدث بالضبط:": "Turn on the AC now with the remote or the button, and watch exactly what happens:",
  "شغّل حوض الغسيل الآن، وراقب ماذا يحدث بالضبط:": "Start the wash tub now, and watch exactly what happens:",
  "شغّل دورة تنشيف فقط الآن واستمع: هل تسمع صوت 'طقّة' قفل الباب عند بدء الدورة؟": "Run a spin-only cycle now and listen: do you hear a door-lock 'click' when the cycle starts?",
  "شغّل مكيف الشباك الآن من الزر أو الريموت، وراقب ماذا يحدث بالضبط:": "Turn on the window unit now from the button or remote, and watch exactly what happens:",
  "شمعة إشعال (Igniter)": "Igniter",
  "شمعة إشعال تالفة تماماً": "Completely failed igniter",
  "شمعة إشعال ضعيفة": "Weak igniter",
  "صانعة الثلج لا تعمل": "Ice maker doesn't work",
  "صمام أو خرطوم تصريف مشترك تالف": "Faulty shared drain valve/hose",
  "صمام الغاز (Safety Valve) لا يفتح بشكل صحيح": "Gas safety valve not opening properly",
  "صمام المياه (Water Inlet Valve)": "Water inlet valve",
  "صمام تعبئة الماء (Water Inlet Valve)": "Water inlet valve",
  "صمام غاز (Safety Valve) — يفضّل فني للتركيب": "Gas safety valve — a technician is preferred for installation",
  "صمام مياه (Water Inlet Valve)": "Water inlet valve",
  "صمام/أنبوب تصريف": "Drain valve/pipe",
  "صمام/خرطوم تصريف": "Drain valve/hose",
  "صوت الفحيح مع تجمد الثلج على الأنابيب توقيع شبه مؤكد لأحد سببين: تسريب في غاز التبريد، أو انسداد بصمام التمدد/الأنبوب الشعري. كلا السببين يعطيان نفس الأعراض الخارجية تماماً ولا يمكن التفريق بينهما إلا بقياس ضغط فعلي بمعدات متخصصة. كلاهما يحتاج فني بالضرورة.": "A hissing sound with ice forming on the pipes is a near-certain sign of one of two causes: a refrigerant leak, or a blocked expansion valve/capillary tube. Both causes produce exactly the same outward symptoms and can only be told apart with an actual pressure gauge check by specialized equipment. Both necessarily need a technician.",
  "صوت طنين فقط، بدون دوران المروحة أو التبريد": "Just a humming sound, no fan spinning or cooling",
  "صوت غريب": "Strange noise",
  "صوت غريب (صفير / ضجيج)": "Strange noise (whistling / rattling)",
  "صوت غريب أو اهتزاز عالٍ أثناء التنشيف": "Strange noise or loud vibration during spin",
  "صوت غريب قوي أو اهتزاز شديد بحوض التنشيف تحديداً": "Loud strange noise or severe vibration specifically in the spin tub",
  "صوت يصدر من صانعة الثلج لكن لا ينزل ثلج للسلة": "A sound comes from the ice maker but no ice drops into the bin",
  "ضع يدك الآن أمام فتحة دخول الهواء للوحدة الداخلية، ثم أمام فتحة خروج الهواء البارد مباشرة: هل تحس فرق حرارة واضح بينهما، أم الفرق بسيط جداً وتقريباً نفس الحرارة؟": "Put your hand now in front of the indoor unit's air intake, then directly in front of the cold air outlet: do you feel a clear temperature difference between them, or is the difference very slight, almost the same temperature?",
  "ضع يدك الآن أمام فتحة دخول الهواء، ثم أمام فتحة خروج الهواء البارد مباشرة: هل تحس فرق حرارة واضح، أم الفرق بسيط جداً وتقريباً نفس الحرارة؟": "Put your hand now in front of the air intake, then directly in front of the cold air outlet: do you feel a clear temperature difference, or is the difference very slight, almost the same temperature?",
  "طنين الموتور بدون حركة فعلية نمط مألوف لكباستور تشغيل ضعيف يمنع الموتور من إكمال الدوران. جرّب الكباستور أولاً (أرخص بكثير) قبل التفكير باستبدال الموتور كاملاً.": "A humming motor with no actual movement is a familiar sign of a weak run capacitor preventing the motor from completing its rotation. Try the capacitor first (much cheaper) before considering replacing the whole motor.",
  "طنين الموتور بدون دوران فعلي للعصا الدوارة (Pulsator) نمط مألوف لكباستور ضعيف. جرّب الكباستور أولاً — أرخص بكثير من الموتور كاملاً.": "A humming motor with no actual pulsator movement is a familiar sign of a weak capacitor. Try the capacitor first — much cheaper than the whole motor.",
  "عائق يمنع إغلاق الباب بالكامل": "An obstruction preventing the door from closing fully",
  "عادية (حوضين منفصلين — غسيل وتنشيف)": "Twin-tub (separate wash and spin tubs)",
  "عدم التنظيف لفترة طويلة يقلل كفاءة التبريد بشكل كبير حتى مع سلامة باقي الأجزاء. جرّب التنظيف الشامل للوحدة الخارجية قبل شراء أي قطعة.": "Not cleaning for a long time significantly reduces cooling efficiency even if every other part is fine. Try a thorough clean of the outdoor unit before buying any part.",
  "عدم التوهج إطلاقاً أو التوهج غير المتساوي مع نقاط سوداء دليل مباشر على تلف عنصر التسخين السفلي نفسه.": "No glow at all, or an uneven glow with black spots, is direct evidence the bottom heating element itself has failed.",
  "عدم تغيير الفلتر لفترة طويلة يسبب انسداداً تدريجياً يمنع وصول الماء لصانعة الثلج. هذه أرخص قطعة يُنصح بتجربتها أولاً.": "Not changing the filter for a long time causes a gradual clog that blocks water from reaching the ice maker. This is the cheapest part, recommended to try first.",
  "عدم وجود فرق حرارة يُذكر رغم عمل كل الأجزاء الظاهرة بشكل طبيعي (لا رائحة، لا فحيح، نظافة تامة، مروحة تدور) يشير لمشكلة داخلية بدائرة التبريد نفسها — إما نقص كبير بالفريون بدون تسريب مسموع، أو كمبروسر يعمل ميكانيكياً بشكل طبيعي لكن لا يضغط الغاز بكفاءة كافية داخلياً (تآكل داخلي). كلا الاحتمالين لا يمكن تأكيدهما إلا بقياس ضغط فعلي من فني، ولا توجد قطعة يمكن اقتراحها بثقة بهذه المرحلة.": "No noticeable temperature difference despite every visible part working normally (no smell, no hiss, perfectly clean, fan spinning) points to an internal problem within the refrigerant circuit itself — either a major refrigerant shortage with no audible leak, or a compressor running mechanically fine but not compressing gas efficiently internally (internal wear). Neither possibility can be confirmed except by an actual pressure gauge check from a technician, and no part can be confidently suggested at this stage.",
  "عدم وصول أي إشارة أو صوت للموتور رغم تعبئة الماء بنجاح يشير لعطل ببطاقة التحكم الإلكترونية أو التايمر الميكانيكي (بالموديلات الأقدم) الذي لا يرسل تياراً للموتور بالتوقيت الصحيح.": "No signal or sound reaching the motor at all despite successful water filling points to a fault in the electronic control board, or the mechanical timer (on older models) not sending current to the motor at the right time.",
  "عدّل وضعية الخرطوم (لا يتجاوز 15 سم داخل الأنبوب) وأعد الاختبار": "Adjust the hose position (no more than 15 cm inside the pipe) and re-test",

  "غالباً يُحل بإعادة التشغيل الكامل (فصل الكهرباء 5 دقائق ثم إعادتها). إذا تكرر الكود، المشكلة بالبطاقة الرئيسية أو الشاشة.": "Usually resolved with a full power reset (unplug for 5 minutes, then plug back in). If the code recurs, the issue is with the main board or display.",

  "فصل القاطع الرئيسي بالكامل وبسرعة يشير لتيار مسحوب مرتفع جداً (قريب من تيار الإقلاع المقفول)، وهذا نمط أقرب لكمبروسر مقفول ميكانيكياً من كباستور عادي. مع ذلك، هذا لا يزال احتمالاً وليس تأكيداً — الفصل النهائي يحتاج قياس تيار فعلي بجهاز كلامب متر من فني. ملاحظة أمان مهمة: توقف عن تكرار محاولات التشغيل أو إعادة رفع القاطع بشكل متكرر — هذا يُسرّع تلف ملفات الكمبروسر إذا كان هو السبب فعلاً.": "The main breaker tripping fully and quickly points to a very high current draw (close to a locked-rotor current), a pattern closer to a mechanically locked compressor than a normal capacitor. Still, this remains a likelihood, not a certainty — final confirmation needs an actual clamp meter current reading from a technician. Important safety note: stop repeatedly trying to start it or resetting the breaker — this speeds up damage to the compressor windings if that is indeed the cause.",
  "فصل القاطع فور التشغيل يشير لتماس كهربائي حقيقي بأحد العناصر أو الأسلاك. لا تكرر محاولة رفع القاطع أكثر من مرة — هذا يزيد خطر التلف أو الحريق.": "The breaker tripping as soon as it starts points to a real electrical short in one of the elements or wires. Don't repeatedly try resetting the breaker — this increases the risk of damage or fire.",
  "فكّر بآخر مرة صار فيها هذا الطنين بالضبط: هل القاطع الكهربائي الرئيسي بلوحة كهرباء المنزل فصل بالكامل (احتجت ترفعه يدوياً)، أم توقف الطنين من تلقاء نفسه دون أن يفصل القاطع الرئيسي؟": "Think back to the last time exactly this hum happened: did the main breaker at the home's electrical panel trip fully (you had to manually reset it), or did the hum stop on its own without the main breaker tripping?",

  "مع استبعاد الفلتر والصمام، المشكلة على الأغلب بوحدة صانعة الثلج نفسها (الموتور أو الميكانيزم الداخلي).": "With the filter and valve ruled out, the problem is most likely the ice maker unit itself (the motor or internal mechanism).",
  "مع استبعاد انسداد الفلتر ووضعية الخرطوم، المشكلة الأرجح مضخة التصريف نفسها (موتور المضخة تالف أو الدفاعة مكسورة).": "With a clogged filter and hose position ruled out, the most likely problem is the drain pump itself (the pump motor failed or the impeller is broken).",
  "مع التأكد من إغلاق الباب بإحكام تام وعدم وجود عوائق، العطل الأرجح بآلية القفل نفسها أو مفتاح استشعار إغلاق الباب.": "With the door confirmed fully closed and no obstructions, the most likely fault is in the lock mechanism itself or the door-closed sensor switch.",
  "مع التأكد من البطارية، المشكلة غالباً في وحدة استقبال الريموت داخل الجهاز نفسه.": "With the battery confirmed fine, the problem is usually in the remote signal receiver inside the unit itself.",
  "مع التأكد من سلامة القاطع والمصدر الخارجي، الاحتمال الأرجح هو فيوز داخلي بالجهاز (أرخص بكثير) وليس بالضرورة البطاقة الإلكترونية كاملة. يُنصح بفحص الفيوز الداخلي أولاً قبل شراء بطاقة تحكم.": "With the breaker and external power source confirmed fine, the most likely cause is an internal fuse in the unit (much cheaper), not necessarily the whole control board. It's advisable to check the internal fuse first before buying a control board.",
  "مع التأكد من سلامة الكهرباء الخارجية، الاحتمال الأرجح ثرموستات لا يمرر الإشارة للكمبروسر، أو بطاقة تحكم. الثرموستات أرخص بكثير، يُنصح بفحصه أولاً.": "With external power confirmed fine, the most likely cause is a thermostat not passing the signal to the compressor, or the control board. The thermostat is much cheaper, so it's advisable to check it first.",
  "مع تأكد إغلاق الغطاء بالكامل وعدم دوران حوض التنشيف، الاحتمال الأرجح كباستور موتور التنشيف (منفصل عادة عن موتور الغسيل بالغسالات العادية).": "With the lid confirmed fully closed and the spin tub not turning, the most likely cause is the spin motor's capacitor (usually separate from the wash motor in twin-tub washers).",
  "مع سلامة الحلقة والمكثف، السبب الأرجح ازدحام الثلاجة بمحتوى يمنع دوران الهواء بشكل صحيح، أو إعداد حرارة مرتفع جداً. جرّب تعديل الإعداد وترك مسافات بين الأطعمة أولاً.": "With the seal and condenser both fine, the most likely cause is the fridge being overcrowded with items blocking proper airflow, or the temperature setting being too high. Try adjusting the setting and leaving gaps between food items first.",
  "مع عمل عنصر الشواء وعدم دقة أو ضعف وضع الخبز تحديداً، الاحتمال الأرجح ثرموستات أو حساس خاص بدارة الخبز لا يعمل بدقة.": "With the broil element working and the bake mode specifically inaccurate or weak, the most likely cause is a thermostat or sensor specific to the bake circuit not working accurately.",

  "مكيف الشباك وحدة واحدة مدمجة، فلا يوجد تفريق بين وحدة داخلية وخارجية كالسبليت": "A window unit is a single combined unit, so there's no separate indoor/outdoor unit distinction like split systems",
  "مكيف الشباك يجب أن يكون مائلاً قليلاً للخلف (نحو الخارج) ليصرف الماء بعيداً عن الغرفة بفعل الجاذبية. إذا كان مركّباً بشكل مستوٍ تماماً أو مائل للأمام، أو إذا انسدت قناة التصريف الداخلية بالأتربة، سيتسرب الماء للداخل بدل الخارج.": "A window unit should tilt slightly backward (toward the outside) so gravity drains water away from the room. If it's installed perfectly level or tilted forward, or if the internal drain channel is clogged with dust, water will leak inward instead of outward.",
  "مكيفات الشباك مصممة لتقطير ماء التكاثف للخارج (تحت النافذة) كجزء طبيعي من عملها، خصوصاً بالأجواء الرطبة. هذا لا يحتاج أي إصلاح أو قطعة.": "Window units are designed to drip condensate water outward (under the window) as a normal part of their operation, especially in humid weather. This needs no repair or part.",
  "من أشيع أسباب توقف الجهاز بالكامل عن الاستجابة رغم سلامة كل الأجزاء الداخلية فعلياً. عند امتلاء حوض تصريف المياه بسبب انسداد الأنبوب، يقطع مفتاح أمان التشغيل بالكامل لحماية الجهاز من تسريب الماء للداخل. الحل غالباً تنظيف مواسير الصرف فقط، دون الحاجة لأي قطعة غيار.": "One of the most common reasons a unit stops responding entirely despite every internal part actually being fine. When the drain pan fills up due to a blocked pipe, a safety switch cuts power completely to protect the unit from leaking water inward. The fix is usually just cleaning the drain pipes, with no spare part needed.",
  "من أي حوض يتسرب الماء بالضبط؟": "Exactly which tub is the water leaking from?",

  "نسبة كبيرة من حالات 'الثلاجة ميتة تماماً' سببها قابس غير متصل جيداً أو قاطع كهربائي فاصل، وليس عطلاً بالثلاجة نفسها. تأكد من هذا أولاً بجهاز كهربائي آخر بنفس المصدر.": "A large share of 'completely dead fridge' cases are caused by a loosely connected plug or a tripped breaker, not a fault in the fridge itself. Confirm this first with another appliance on the same source.",
  "نظّف الفلتر جيداً وأعد الاختبار — إذا استمرت المشكلة أعد التشخيص": "Clean the filter thoroughly and re-test — if it persists, restart the diagnosis",
  "نظّف اللوحة وجفّفها تماماً، ثم أعد المحاولة": "Clean the panel and dry it completely, then try again",
  "نظّف الملف وأعد الاختبار — إذا استمرت المشكلة أعد التشخيص": "Clean the coil and re-test — if it persists, restart the diagnosis",

  "نعم، يوجد طنين خفيف": "Yes, there's a faint hum",
  "نمط 'الطقطقة المتكررة ثم التوقف' يعني غالباً تفعّل واقي الحمل الحراري بالكمبروسر لحمايته — لكن هذا لا يعني أن الكمبروسر نفسه تالف. حسب مصادر فنية متخصصة، السبب الحقيقي الأشيع هو كباستور ضعيف يمنع إكمال الإقلاع، أو اتساخ المكثف الخارجي يرفع ضغط التفريغ. جرّب الكباستور والتنظيف أولاً — أرخص بكثير من استبدال الكمبروسر.": "The 'repeated clicking then stopping' pattern usually means the compressor's thermal overload protector has engaged to protect it — but that doesn't mean the compressor itself is faulty. According to specialized technical sources, the most common real cause is a weak capacitor preventing a complete startup, or a dirty outdoor condenser raising discharge pressure. Try the capacitor and cleaning first — much cheaper than replacing the compressor.",
  "نمط الصوت 'نقرة - طنين - نقرة' المتكرر توقيع شبه مؤكد لريلاي تشغيل تالف يمنع الكمبروسر من إكمال الإقلاع. هذه قطعة رخيصة نسبياً ويُنصح بتجربتها أولاً قبل التفكير بالكمبروسر.": "The repeating 'click - hum - click' sound pattern is a near-certain sign of a failed start relay preventing the compressor from completing startup. This is a relatively cheap part, recommended to try before considering the compressor.",
  "هذا أشيع سبب لعطل التصريف بكثير — خيوط، شعر، أو عملات معدنية تسد الفلتر بمرور الوقت. التنظيف يحل المشكلة غالباً بدون الحاجة لأي قطعة.": "This is by far the most common cause of a drain fault — lint, hair, or coins clogging the filter over time. Cleaning usually solves it without needing any part.",
  "هذا أشيع سبب لهذا الكود — بخار الطبخ يتكاثف على لوحة اللمس ويُفسّر كضغط زر مستمر. نظّف اللوحة بقطعة قماش جافة تماماً أولاً قبل افتراض أي عطل حقيقي.": "This is the most common cause of this code — cooking steam condenses on the touch panel and gets interpreted as a held-down button. Clean the panel with a completely dry cloth first before assuming any real fault.",
  "هذا إنذار أمان طبيعي عندما تتكتل الملابس بجهة واحدة من الحوض أثناء التنشيف السريع. وزّع الغسيل بشكل متساوٍ وأعد المحاولة — لا حاجة لأي قطعة غيار.": "This is a normal safety alarm when clothes bunch up on one side of the tub during fast spin. Redistribute the laundry evenly and try again — no spare part needed.",
  "هذا الحساس يخبر الغسالة بمستوى الماء بالحوض. عطله يمنع تعبئة أو تصريف الماء بالكمية الصحيحة.": "This sensor tells the washer the water level in the tub. Its failure prevents filling or draining the correct amount of water.",
  "هذا العطل شائع جداً وحله رخيص عادة: امتلاء حوض التصريف بسبب انسداد الأنبوب يُفعّل مفتاح أمان يوقف الجهاز بالكامل": "This fault is very common and usually cheap to fix: the drain pan filling up due to a blocked pipe triggers a safety switch that shuts the whole unit down",
  "هذا الفحص يفرّق بين ضعف بسيط بالتبريد ومشكلة حقيقية بدائرة الفريون أو كفاءة الكمبروسر": "This check tells apart mild weak cooling from a real problem in the refrigerant circuit or compressor efficiency",
  "هذا الكود أحياناً مجرد حماية طبيعية بسبب حمولة كبيرة جداً بالغسالة — قلل الحمولة وانتظر 30 دقيقة لتبريد الموتور ثم أعد المحاولة أولاً. إذا تكرر مع حمولة عادية، فالعطل الحقيقي بالموتور أو البطاقة.": "This code is sometimes just normal protection due to too heavy a load in the washer — reduce the load and wait 30 minutes for the motor to cool, then try again first. If it recurs with a normal load, the real fault is in the motor or the board.",
  "هذا الكود قد يعني أن عنصر التسخين عالق بالتشغيل الكامل بدون توقف، وهذا خطر حريق حقيقي. افصل القاطع الكهربائي للفرن فوراً (لا تكتفِ بإيقاف الفرن من الزر)، ولا تستخدمه إطلاقاً حتى فحصه من فني معتمد.": "This code may mean the heating element is stuck fully on without stopping, which is a real fire hazard. Turn off the oven's breaker immediately (don't just turn the oven off with the button), and don't use it at all until a certified technician checks it.",
  "هذا الكود له تفسيران مختلفان حسب موديل الفرن تحديداً. جرّب مسح لوحة التحكم بقطعة قماش جافة أولاً (لا تكلفة) — إذا استمر الكود فالمشكلة الأرجح حساس الحرارة.": "This code has two different interpretations depending on the specific oven model. Try wiping the control panel with a dry cloth first (no cost) — if the code persists, the temperature sensor is the more likely cause.",
  "هذا الكود يشير لعطل داخلي بالكمبروسر يمنعه من ضخ الفريون بشكل صحيح. لا يمكن تشخيصه ذاتياً أو إصلاحه بدون معدات متخصصة.": "This code indicates an internal compressor fault preventing it from pumping refrigerant properly. It can't be self-diagnosed or repaired without specialized equipment.",
  "هذا الكود يشير لمشكلة بالتيار الكهربائي الواصل للغسالة أو بمكوناتها الداخلية. افصل الغسالة عن الكهرباء ولا تحاول التشغيل مرة أخرى قبل فحصها من فني معتمد.": "This code indicates a problem with the electrical current reaching the washer or its internal components. Unplug the washer and don't try to run it again before a certified technician checks it.",
  "هذا الكود يعني أن الثلاجة بوضع 'Demo/Shop Mode' المخصص للمعارض، ولا يعني وجود عطل إطلاقاً. يُعطَّل من قائمة الإعدادات بالضغط على مفاتيح محددة حسب دليل الموديل.": "This code means the fridge is in 'Demo/Shop Mode' meant for showrooms, and doesn't indicate any fault at all. It's turned off from the settings menu by pressing specific keys per the model's manual.",
  "هذا توقيع صوتي شبه مؤكد لريلاي التشغيل التالف": "This is a near-certain audio signature of a failed start relay",
  "هذا سلوك طبيعي — ليس عطلاً": "This is normal behavior — not a fault",
  "هذا مؤشر على تسريب في غاز التبريد (الفريون)": "This is a sign of a refrigerant gas leak",
  "هذا مؤشر مهم على وجود تسريب في الغاز (الفريون)": "This is an important sign of a refrigerant gas leak",
  "هذا يحدد إذا كانت المشكلة بالوحدة الداخلية نفسها أو بالوحدة الخارجية فقط": "This determines whether the problem is with the indoor unit itself or only the outdoor unit",
  "هذا يضمن اقتراح القطعة الصحيحة المتوافقة مع جهازك تحديداً": "This ensures suggesting the correct part specifically compatible with your unit",
  "هذه أول خطوة يتبعها أي فني قبل أي تشخيص آخر — نسبة كبيرة من حالات 'الجهاز ميت تماماً' سببها قاطع كهربائي فاصل أو مصدر كهرباء غير سليم، وليس عطلاً بالجهاز نفسه. تأكد من هذا أولاً بجهاز كهربائي آخر بنفس المصدر.": "This is the first step any technician follows before any other diagnosis — a large share of 'completely dead unit' cases are caused by a tripped breaker or a faulty power source, not a fault in the unit itself. Confirm this first with another electrical appliance on the same source.",
  "هل الصوت أو الاهتزاز يزيد بوضوح تحديداً أثناء مرحلة التنشيف بالسرعة العالية؟": "Does the noise or vibration clearly increase specifically during the high-speed spin stage?",
  "هل تشم رائحة غاز الآن؟": "Do you smell gas right now?",
  "هل تصل الكهرباء للفرن (الشاشة أو إضاءة الفرن الداخلية تعمل)؟": "Is power reaching the oven (the display or interior light works)?",
  "هل جربت الشواء (Broil) — هل عنصر الشواء العلوي يعمل بشكل طبيعي؟": "Have you tried Broil — does the top broil element work normally?",
  "همهمة عالية مستمرة بدون توقف، مع استبعاد تجمد الملف ومروحة المكثف، تشير لمشكلة داخلية بدائرة التبريد — إما نقص فريون بدون تسريب مسموع واضح، أو كمبروسر يعمل ميكانيكياً لكن لا يضغط الغاز بكفاءة كافية. كلا الاحتمالين يحتاج قياس ضغط فعلي من فني، ولا توجد قطعة يمكن اقتراحها بثقة بهذه المرحلة.": "A continuous loud drone without stopping, with coil frost and the condenser fan ruled out, points to an internal problem in the refrigeration circuit — either a refrigerant shortage with no clearly audible leak, or a compressor running mechanically but not compressing gas efficiently enough. Both possibilities need an actual pressure gauge check from a technician, and no part can be confidently suggested at this stage.",
  "وجود فرق حرارة واضح بين الهواء الداخل والخارج يعني دائرة الفريون تعمل جزئياً على الأقل. السبب الأرجح نقص طفيف بالفريون، أو أن سعة الجهاز (بالطن) لا تناسب حجم الغرفة أصلاً، أو تراكم غبار داخلي دقيق على الملف لم يظهر بصرياً بوضوح. يُنصح بفحص فني لقياس شحنة الفريون بدقة قبل أي شراء.": "A clear temperature difference between the incoming and outgoing air means the refrigerant circuit is working at least partially. The most likely cause is a slight refrigerant shortage, or the unit's capacity (in tons) not suiting the room size to begin with, or fine dust buildup on the coil not visually obvious. A technician's check to precisely measure the refrigerant charge is recommended before any purchase.",
  "وحدة استقبال الريموت": "Remote signal receiver",
  "وحدة صانعة الثلج (Ice Maker Assembly)": "Ice maker assembly",
  "وحدة صانعة الثلج نفسها": "The ice maker unit itself",
  "وزّع الحمولة بالتساوي داخل الحوض وأعد المحاولة": "Redistribute the load evenly in the tub and try again",
  "وصلة أسلاك أعلى الباب غير متصلة جيداً": "Wire harness above the door not connected properly",
  "وصول الكهرباء للفرن دون أي توهج بالشمعة إطلاقاً يشير مباشرة لشمعة إشعال تالفة بالكامل أو عدم وصول الكهرباء لها تحديداً.": "Power reaching the oven with absolutely no glow from the igniter points directly to a completely failed igniter, or power specifically not reaching it.",
  "وضع العرض التجاري مفعّل — ليس عطلاً": "Store demo mode is on — not a fault",
  "وضعية خرطوم التصريف غير صحيحة": "Incorrect drain hose position",

  "يتسرب فعلياً لداخل الغرفة": "It's actually leaking into the room",
  "يتوهج بشكل طبيعي وكامل، لكن الفرن لا يسخن للحرارة المطلوبة": "Glows fully and normally, but the oven doesn't reach the required temperature",

    result: true, level: "high", confidence: "80%",
    title: "صمام أو خرطوم تصريف مشترك تالف",
    desc: "تسريب من نقطة التصريف المشتركة بين الحوضين يشير مباشرة لصمام التصريف نفسه أو تلف بالخرطوم عند نقطة الاتصال.",
    part: "صمام/خرطوم تصريف",
    partIcon: "drain"
  }
};

// ============ محرك التشغيل ============
let history = ["appliance_select"];
let feedbackGiven = {};
let stats = { total: 0, confirmed: 0 };

// ---- نظام حد الاستخدام المجاني (مربوط بخادم حقيقي، لا يمكن تخطيه من المتصفح) ----
const API_URL = "https://tsoubglpjezhmaacqynk.supabase.co/functions/v1/diagnostic-api";
const FREE_LIMIT = 3; // نفس الرقم مضبوط بالخادم أيضاً — التغيير هنا للعرض فقط
let usageStatus = { used: 0, limit: FREE_LIMIT, remaining: FREE_LIMIT };

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzb3ViZ2xwamV6aG1hYWNxeW5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MzU1NDgsImV4cCI6MjEwNDIxMTU0OH0.swNOES-clBhQUgecdOFLA6MMO8X0MHqcUHds838fXX8";
async function apiCall(payload){
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify(payload)
    });
    return await res.json();
  } catch(e){
    console.error("API error:", e);
    return null;
  }
}
async function refreshUsageStatus(){
  const res = await apiCall({ action: "get_status" });
  if(res && typeof res.used === "number"){
    usageStatus = res;
  }
  updateUsageBadge();
}
function updateUsageBadge(){
  const badge = document.getElementById('usageBadge');
  if(!badge) return;
  badge.textContent = usageStatus.remaining > 0
    ? `${t('متبقي لك')} ${usageStatus.remaining} ${t('من')} ${usageStatus.limit} ${t('تشخيصات مجانية')}`
    : t('انتهت تشخيصاتك المجانية لهذه الفترة');
}

const cardRoot = document.getElementById('cardRoot');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const statsBar = document.getElementById('statsBar');
refreshUsageStatus();

function estimateDepth(){
  // تقدير تقريبي لعمق الشجرة لعرض progress
  return Math.min(history.length, 5);
}

function render(){
  const nodeId = history[history.length-1];

  if(nodeId === "LIMIT_REACHED"){
    progressFill.style.width = '100%';
    progressLabel.textContent = t('النتيجة');
    cardRoot.innerHTML = `
      <div class="result-title">${t('انتهت تشخيصاتك المجانية 🙏')}</div>
      <div class="result-desc">
        ${t('استخدمت الـ')}${FREE_LIMIT} ${t('تشخيصات المجانية المتاحة حالياً بفترة الاختبار.')}
        ${t('نشكرك على تجربة الأداة! تابعنا لمعرفة موعد إطلاق الاشتراك الكامل بسعر رمزي لكل تشخيص.')}
      </div>
      <button class="cta-btn ghost" onclick="restart()">${t('ابدأ من جديد (لأغراض العرض فقط)')}</button>
    `;
    return;
  }

  const node = tree[nodeId];
  const depth = estimateDepth();
  progressFill.style.width = (node.result ? 100 : (depth/5)*90) + '%';
  progressLabel.textContent = node.result ? t('النتيجة') : `${t('الخطوة')} ${history.length}`;

  if(!node.result){
    let html = '';
    if(history.length > 1){
      html += `<button class="back-btn" onclick="goBack()">${t('‹ رجوع')}</button>`;
    }
    if(selectedBrand && nodeId !== 'brand_select' && nodeId !== 'fr_brand_select'){
      html += `<span class="tag" style="margin-bottom:12px;">${t('الجهاز')}: ${selectedBrand}</span>`;
    }
    html += `<div class="q-title">${t(node.q)}</div>`;
    if(node.hint){ html += `<div class="q-hint">${t(node.hint)}</div>`; }
    html += `<div class="options">`;
    node.options.forEach((opt,i)=>{
      const brandAttr = opt.setBrand ? opt.setBrand : '';
      const applianceAttr = opt.setAppliance ? opt.setAppliance : '';
      html += `<button class="opt-btn" onclick="choose('${opt.next}', '${brandAttr}', '${applianceAttr}')">${t(opt.label)}</button>`;
    });
    html += `</div>`;
    cardRoot.innerHTML = html;
  } else {
    let badgeClass = 'badge-high';
    if(node.level === 'mid') badgeClass = 'badge-mid';
    if(node.level === 'danger') badgeClass = 'badge-danger';

    let html = `<button class="back-btn" onclick="goBack()">${t('‹ رجوع')}</button>`;
    if(node.categoryLabel){
      html += `<span class="result-badge badge-high" style="margin-left:8px;">${t('✓ مؤكد')}: ${t(node.categoryLabel)}</span>`;
    }
    html += `<span class="result-badge ${badgeClass}">${t('دقة السبب المحدد')}: ${node.confidence}</span>`;
    html += `<div class="result-title">${t(node.title)}</div>`;
    html += `<div class="result-desc">${t(node.desc)}</div>`;

    if(node.part){
      const brandLine = selectedBrand ? `<p class="part-label" style="margin-top:8px;">${t('متوافقة مع')}: ${selectedBrand}</p>` : '';
      const iconKey = node.partIcon && partIcons[node.partIcon] ? node.partIcon : 'generic';
      const iconHtml = `<div class="part-icon">${partIcons[iconKey]}</div><p style="font-size:11px;color:var(--muted);margin:-4px 0 12px;">${t('رسم توضيحي تخطيطي — ليس صورة للقطعة الفعلية')}</p>`;
      html += `<div class="part-box" style="text-align:center;">
        ${iconHtml}
        <p class="part-label">${t('القطعة المقترحة')}</p>
        <p class="part-name">${t(node.part)}</p>
        ${brandLine}
      </div>`;
    } else if(node.level === 'danger'){
      html += `<button class="cta-btn danger">${t('اتصل بفني معتمد الآن')}</button>`;
    } else {
      const label = node.actionLabel ? t(node.actionLabel) : t("هذه الحالة تحتاج فحص فني مباشر");
      html += `<button class="cta-btn ghost">${label}</button>`;
    }

    html += `<button class="cta-btn ghost" onclick="restart()" style="margin-top:0;">${t('ابدأ تشخيص جديد')}</button>`;

    html += `<div class="feedback-row" id="fbRow">
      <p>${t('هل كان هذا التشخيص صحيحاً؟')}</p>
      <button class="fb-btn" onclick="giveFeedback(true)">${t('✅ نعم صحيح')}</button>
      <button class="fb-btn" onclick="giveFeedback(false)">${t('❌ غير دقيق')}</button>
    </div>`;

    cardRoot.innerHTML = html;
  }
  renderStats();
}

async function choose(next, brand, appliance){
  if(brand){ selectedBrand = brand; }
  if(appliance){ currentAppliance = appliance; }
  if(next === "ERROR_ROUTE"){
    let prefix = "error_codes_";
    let fallback = "error_codes_generic";
    if(currentAppliance === "fridge"){ prefix = "fr_error_codes_"; fallback = "fr_error_codes_generic"; }
    if(currentAppliance === "oven"){ prefix = "ov_error_codes_"; fallback = "ov_error_codes_generic"; }
    if(currentAppliance === "washer"){ prefix = "wm_error_codes_"; fallback = "wm_error_codes_generic"; }
    const key = prefix + selectedBrand;
    next = tree[key] ? key : fallback;
  }
  if(tree[next] && tree[next].result){
    cardRoot.innerHTML = `<p style="text-align:center;color:var(--muted);padding:30px 0;">${t('جاري التحقق...')}</p>`;
    const res = await apiCall({ action: "check_and_use", appliance: currentAppliance, brand: selectedBrand });
    if(res && typeof res.used === "number"){
      usageStatus = { used: res.used, limit: res.limit, remaining: Math.max(0, res.limit - res.used) };
      updateUsageBadge();
    }
    // مهم: لو فشل الاتصال بالخادم لأي سبب (شبكة، سيرفر، إلخ)، نسمح بالاستمرار افتراضياً
    // بدل منع المستخدم ظلماً. المنع الفعلي يصير فقط إذا الخادم رد صراحة بأن الحد انتهى.
    if(res && res.allowed === false){
      history.push("LIMIT_REACHED");
      render();
      return;
    }
  }
  history.push(next);
  render();
}
function goBack(){
  if(history.length > 1){ history.pop(); render(); }
}
function restart(){
  selectedBrand = null;
  currentAppliance = null;
  history = ["appliance_select"];
  render();
}
function giveFeedback(correct){
  stats.total += 1;
  if(correct) stats.confirmed += 1;
  const row = document.getElementById('fbRow');
  if(correct){
    logFeedback(true, '');
    row.innerHTML = `<p class="thanks">${t('شكراً، تم تسجيل ملاحظتك — هذا يساعد على تحسين دقة الأداة.')}</p>`;
  } else {
    row.innerHTML = `
      <p style="width:100%;font-size:13px;color:var(--muted);margin-bottom:8px;">${t('وش كانت المشكلة الفعلية؟ (اختياري، يساعدنا كثير نطوّر الدقة)')}</p>
      <textarea id="fbNote" rows="2" style="width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px;color:var(--cream);font-family:'Tajawal',sans-serif;font-size:13px;margin-bottom:8px;box-sizing:border-box;" placeholder="${t('مثال: طلع فعلياً موتور تالف مو كباستور')}"></textarea>
      <button class="cta-btn" style="margin-bottom:0;" onclick="submitFeedbackNote()">${t('إرسال')}</button>
    `;
  }
  renderStats();
}
function submitFeedbackNote(){
  const noteEl = document.getElementById('fbNote');
  const note = noteEl ? noteEl.value : '';
  logFeedback(false, note);
  document.getElementById('fbRow').innerHTML = `<p class="thanks">${t('شكراً على ملاحظتك التفصيلية — هذا يساعدنا كثير نطوّر الدقة.')}</p>`;
}
function logFeedback(correct, note){
  const nodeId = history[history.length-1];
  apiCall({
    action: "feedback",
    appliance: currentAppliance,
    brand: selectedBrand,
    diagnosisTitle: (tree[nodeId] && tree[nodeId].title) || '',
    correct: correct,
    note: note
  });
}
function renderStats(){
  if(stats.total === 0){ statsBar.innerHTML = ''; return; }
  const pct = Math.round((stats.confirmed/stats.total)*100);
  statsBar.innerHTML = `<span>${t('عدد التقييمات هذه الجلسة')}: ${stats.total}</span><span>·</span><span>${t('دقة مؤكدة')}: ${pct}%</span>`;
}

render();
</script>
</body>
</html>
